[package]
name = "canaryd"
version = "1.0.0"
edition = "2021"
description = "Secret Canary helper: clipboard + staged-diff secret detection for the Omarchy plugin"
license = "MIT"
publish = false

[lib]
name = "canaryd"
path = "src/lib.rs"

[[bin]]
name = "canaryd"
path = "src/main.rs"

[dependencies]
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
